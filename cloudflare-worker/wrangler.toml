name = "pwnf-checkout"
main = "worker.js"
compatibility_date = "2024-01-01"

# Routes — the Worker handles /api/* on your domain
[[routes]]
pattern = "patriotwashnfold.com/api/*"
zone_name = "patriotwashnfold.com"

# Environment variables are set via the Cloudflare dashboard (not here)
# Required secrets:
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   GHL_SIGNUP_WEBHOOK
#   GHL_PAYMENT_WEBHOOK
